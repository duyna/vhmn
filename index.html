<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Vận hành Miền Nam Quý 4/2026</title>
<!--
  TRANG ĐĂNG NHẬP · đặt trên GitHub Pages. Trang này KHÔNG chứa số liệu hay mã của app.
  Đăng nhập Google xong, máy chủ (Apps Script) kiểm tra email trong sheet "Người dùng" rồi mới gửi app và số liệu về.
  Chỉ cần sửa 2 dòng có chữ DAN_..._VAO_DAY bên dưới (một lần, khi cài đặt).
-->
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--bg:#f4f5f7;--surface:#fff;--text:#15181c;--muted:#5d6670;--border:#e0e3e8;--accent:#1c5cbd;--bad:#c1262d;--bad-bg:#fde7e7}
@media (prefers-color-scheme:dark){:root{--bg:#111316;--surface:#191c20;--text:#e7e9ec;--muted:#98a1ab;--border:#2d3239;--accent:#6ea0ff;--bad:#ff8a8a;--bad-bg:#3a1d1f}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text);
  font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:28px 26px;max-width:420px;width:100%;
  box-shadow:0 1px 3px rgba(0,0,0,.06)}
h1{font-size:19px;margin:0 0 4px}
p{margin:0;color:var(--muted);font-size:13.5px}
#gbtn{margin:22px 0 10px;min-height:44px;display:flex;justify-content:center}
#msg{min-height:20px;font-size:13.5px}
#msg.err{color:var(--bad);background:var(--bad-bg);border-radius:8px;padding:8px 10px}
.foot{margin-top:14px;font-size:12px}
</style>
</head>
<body>
<div class="card">
  <h1>Vận hành Miền Nam · Quý 4/2026</h1>
  <p>Phòng Vận hành Miền Nam · nội bộ. Đăng nhập bằng Gmail đã được cấp quyền.</p>
  <div id="gbtn"></div>
  <div id="msg"></div>
  <p class="foot">Không vào được? Báo Giám đốc Vận hành Miền Nam thêm Gmail của bạn vào danh sách.</p>
</div>
<script>
(()=>{ // để trong hàm: không để lại biến chung, tránh trùng tên với app sau khi tải về
// ===== CHỈ SỬA 2 DÒNG NÀY =====
const API='https://script.google.com/macros/s/AKfycbxDhvrDTebGQvo_HeksSHQyWhlIfFKqCYZsJDA9ylGfY8Qj-CQ0X3XhZGP3ZA8DfIq1Cw/exec';                               // link Web app của máy chủ, dạng https://script.google.com/macros/s/…/exec
const CLIENT_ID='494104276585-nv8h4bs6pkku50ct9mutkdi02ok1mnlj.apps.googleusercontent.com'; // mã ứng dụng đăng nhập Google (giống trong MayChu.gs)
// ==============================
const TK='vhmn_tok',OUT='vhmn_out';
const $msg=document.getElementById('msg');
const say=(t,err)=>{$msg.textContent=t||'';$msg.className=err?'err':'';};
const ls={get:k=>{try{return localStorage.getItem(k);}catch(e){return null;}},set:(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v);}catch(e){}}};
async function call(op,a,t){
  const r=await fetch(API,{method:'POST',credentials:'omit',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({t:t||'',op,a:a||{}})});
  if(!r.ok)throw Object.assign(new Error('Máy chủ trả lỗi '+r.status+'. Thử lại sau ít phút.'),{code:'http'});
  const j=await r.json();if(!j.ok)throw Object.assign(new Error(j.message||'Lỗi máy chủ'),{code:j.code});return j.data;
}
// Tải app từ máy chủ rồi thay toàn bộ trang này bằng app. Chỉ làm 1 lần: Google có thể gọi đăng nhập 2 lần
// (bấm nút + khung One Tap tự đăng nhập); nạp app lần 2 sẽ làm mã app báo lỗi và trang đứng im.
let busy=false,done=false;
async function enter(tok){
  if(done)return;say('Đang tải số liệu…');
  const d=await call('boot',{},tok);
  if(done)return;done=true;
  try{google.accounts.id.cancel();}catch(e){}
  // Kiểm tra mã app trước khi mở: nếu nội dung máy chủ gửi về bị hỏng thì báo và cho tải về để kiểm tra, không để trang trắng
  const bad=checkApp(d.html);
  if(bad){done=false;busy=false;showBroken(d.html,bad);return;}
  window.__ONLINE={api:API,token:tok,user:d.user,state:d.state};
  document.open();document.write(d.html);document.close();
}
function checkApp(html){
  const s=[...html.matchAll(/<script>([\s\S]*?)<\/script>/g)].map(m=>m[1]).sort((a,b)=>b.length-a.length)[0];
  if(!s)return 'Không thấy mã app trong nội dung máy chủ gửi về (file App trong Apps Script trống hoặc sai).';
  try{new Function(s);return '';}catch(e){return 'Mã app máy chủ gửi về bị lỗi: '+e.message;}
}
function showBroken(html,msg){
  say(msg+' Bấm nút dưới để tải bản nhận được về máy rồi báo người hỗ trợ kỹ thuật.',true);
  const a=document.createElement('a');a.textContent='Tải bản app nhận được (app-nhan-tu-may-chu.html)';
  a.href=URL.createObjectURL(new Blob([html],{type:'text/plain;charset=utf-8'}));a.download='app-nhan-tu-may-chu.html';
  a.style.cssText='display:inline-block;margin-top:10px;font-size:13.5px';$msg.after(a);
}
async function onGoogle(res){
  if(busy||done)return;busy=true;say('Đang kiểm tra quyền…');
  try{const d=await call('login',{idToken:res.credential});ls.set(TK,d.token);ls.set(OUT,null);await enter(d.token);}
  catch(e){busy=false;say(e.code==='http'||e instanceof TypeError?'Không kết nối được máy chủ. Kiểm tra mạng rồi thử lại.':e.message,true);}
}
function showButton(){
  if(!window.google||!google.accounts){setTimeout(showButton,200);return;}
  google.accounts.id.initialize({client_id:CLIENT_ID,callback:onGoogle,auto_select:!ls.get(OUT),cancel_on_tap_outside:false});
  google.accounts.id.renderButton(document.getElementById('gbtn'),{theme:'outline',size:'large',text:'signin_with',shape:'pill',locale:'vi',width:280});
  if(!ls.get(OUT))google.accounts.id.prompt();
}
(async()=>{
  if(API.indexOf('DAN_')===0||CLIENT_ID.indexOf('DAN_')===0){say('Trang chưa cài đặt xong: điền API và CLIENT_ID trong file index.html.',true);return;}
  const tok=ls.get(TK);
  if(tok){try{await enter(tok);return;}catch(e){ls.set(TK,null);if(e.code!=='auth')say(e.message,true);}}
  showButton();
})();
})();
</script>
</body>
</html>
